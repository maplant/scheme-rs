[package]
name = "scheme-rs-gc"
version = "0.1.0"
edition = "2024"
authors = [
    "Matthew Plant <maplant@protonmail.com>",
    "Linus Shoravi <linusshoravi@gmail.com>",
]
description = "Immix heap for scheme-rs, the first step toward an LXR collector"
license = "MPL-2.0"
repository = "https://github.com/maplant/scheme-rs"

[dependencies]
allocator-api2 = "0.4"
async-lock = { version = "3.4", optional = true }
by_address = "1.2"
futures = { version = "0.3", optional = true }
hashbrown = "0.16.1"
indexmap = "2"
parking_lot = "0.12.5"
rustc-hash = "2.1"
tokio = { version = "1.47", features = ["sync"], optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1"

[[bench]]
name = "alloc"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
lxr = []
barrier_count = []
async = ["dep:futures", "dep:async-lock"]
tokio = ["dep:tokio"]
