[package]
name = "scheme-rs"
version = "0.2.0"
edition = "2024"
authors = ["Matthew Plant <maplant@protonmail.com>"]
description = "Embedded scheme for the Rust ecosystem"
license = "MPL-2.0"
keywords = ["scheme", "JIT", "async", "scripting"]

documentation = "https://docs.rs/crate/scheme-rs"
homepage = "https://github.com/maplant/scheme-rs"
repository = "https://github.com/maplant/scheme-rs"

# There must be exactly one scheme-rs runtime image per process (like Guile's
# libguile). Building a dylib alongside the rlib lets plugins and host
# binaries link the runtime dynamically (see .cargo/config.toml), so a
# plugin's dlopen resolves to the image already loaded in the host.
[lib]
crate-type = ["rlib", "dylib"]

# test-plugin must be a workspace member: plugin and host have to agree on
# the exact scheme-rs build (one resolver, one lockfile, one feature
# unification), otherwise the plugin links runtime symbols that do not exist
# in the image the host has already loaded.
[workspace]
members = ["proc-macros", "tests/test-plugin"]

[dependencies]
arc-swap = "1"
async-stream = { version = "0.3", optional = true }
by_address = "1.2"
clap = { version = "4", features = ["derive"] }
derive_builder = "0.20"
futures = { version = "0.3", optional = true }
hashbrown = "0.16.1"
indexmap = "2"
inventory = "0.3"
libloading = { version = "0.8", optional = true }
lsp-server = { version = "0.7.9", optional = true }
lsp-types = { version = "0.97.0", optional = true }
malachite = { version = "0.9", features = ["floats"] }
memchr = "2.7"
num = "0.4"
parking_lot = "0.12.5"
rand = { version = "0.9", features = ["thread_rng"] }
rust-embed = { version = "8", features = ["debug-embed"] }
rustc-hash = "2.1"
rustyline = { version = "17", features = ["derive"] }
scheme-rs-macros = { version = "0.2.0", path = "proc-macros" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
unicode_categories = "0.1"

# TODO: Remove this dependency
stacksafe = "1"

# Cranelift dependencies
cranelift = "0.122"
cranelift-jit = "0.122"
cranelift-native = "0.122"
cranelift-module = "0.122"

# Optional dependencies
tokio = { version = "1.47", features = ["full"], optional = true }

[features]
default = ["load-libraries-from-fs"]
async = ["dep:futures", "dep:async-stream"]
lsp = ["dep:lsp-server", "dep:lsp-types", "dep:serde", "dep:serde_json"]
load-libraries-from-fs = []
plugins = ["dep:libloading"]

[profile.release]
lto = true

[build-dependencies]
nom = "7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "cold_boot"
harness = false

[[bench]]
name = "fib"
harness = false

[[bench]]
name = "integrate"
harness = false

[[bench]]
name = "yin_yang"
harness = false
